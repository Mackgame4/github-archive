### Authentic Roleplay [ARP] ###
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

### FiveM ###
ensure mapmanager
ensure chat
ensure spawnmanager
ensure fivem-map-hipster
#ensure sessionmanager # because what could this possibly do?
ensure hardcap
ensure rconlog

### Settings ###
sv_scriptHookAllowed 0
sv_endpointprivacy true

set onesync_distanceCullVehicles true
set onesync_forceMigration true
set onesync_enableBeyond true
set onesync_population true

exec "environment.cfg"

sv_hostname "ARP - AuthenticRP.com"

sv_maxclients 48

### Vehicles ###
ensure veh-audio
ensure veh-tuner
ensure veh-emergency
ensure veh-muscle
ensure veh-vanilla1
ensure veh-vanilla2
### Maps ###
ensure map-court
ensure map-government
ensure map-vehicles
ensure map-businesses
ensure map-houses
ensure gabz_pillbox
ensure gabz_mrpd

### Resources ###
ensure arp-libs
ensure arp-mongodb
ensure arp-ui
ensure arp-base
ensure arp-queue
ensure arp-chat
ensure arp-character
ensure arp-character-create
ensure arp-menus
ensure arp-freecam
ensure arp-admin
ensure arp-finance
ensure PolyZone
ensure arp-interaction
#ensure arp-inventory # WIP
ensure arp-hud
ensure arp-hudmap
ensure arp-sounds
ensure arp-vehicles
ensure arp-weathertime
ensure arp-med
ensure arp-animate
ensure arp-junk

set chat_showQuits 0
set chat_showJoins 0

#sv_entityLockdown strict

add_ace group.admin command allow # allow all commands
add_ace group.admin command.quit deny # but don't allow quit
add_ace resource.arp-base command.add_principal allow
add_principal resource.arp-base group.admin