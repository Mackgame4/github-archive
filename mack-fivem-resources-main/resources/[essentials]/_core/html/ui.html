<html>
	<head>
		<link rel="stylesheet" href="css/app.css" />
	</head>
	<body>
		
		<div id="languageSelector">
			<h1>Welcome to Prodigy RP</h1>
			<span>Looks like its your first time here. Select a prefered <br> language to start your journey:</span>
			<div class="container">
				<img src="https://cdn.britannica.com/88/3588-004-E0E45339/Flag-Portugal.jpg" width="320" height="220" onClick="selectLanguage('pt')">
				<img src="https://upload.wikimedia.org/wikipedia/commons/b/bb/Arabic-Language-Flag.svg" width="320" height="220" onClick="selectLanguage('ar')">
				<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/English_language.svg/640px-English_language.svg.png" width="320" height="220" onClick="selectLanguage('en')">
			</div>
		</div>
		<div id="hud"></div>
		<div id="inventory_notifications"></div>

		<script src="nui://game/ui/jquery.js" type="text/javascript"></script>
		<script>
			function selectLanguage(locale) {
				fetch(`https://_core/getSelectedLocale`, {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json; charset=UTF-8',
					},
					body: JSON.stringify({
						selectedLocale: locale
					})
				}).then(resp => resp.json()).then(resp => console.log(resp));
			}
		</script>
		<script src="js/mustache.min.js"></script>
		<script src="js/app.js"></script>
	</body>
</html>
