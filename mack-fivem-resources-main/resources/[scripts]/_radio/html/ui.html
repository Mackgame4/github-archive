<!doctype HTML>
<html>
<head>
  <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
  <link rel="stylesheet" href="css/style.css">
  <title>Radio UI</title>
</head>
<body>
    <div id="radio">
      <img src="./img/radio.png" width="310px">
      <button id="onoff" type="submit" name="onoff"></button>
      <div id="channelScroller"></div>
      <div class="screen">
        <span style="position: relative; top: 8px; left: 10px;">Frequency:</span>
        <input id="channel" type="range" style="opacity: .0;" oninput="document.getElementById('vChannel').innerHTML = this.value" min="0" max="100" value="0" autofocus>
        <p style="position: relative; top: 10px; left: 35px;"><span id="vChannel" role="textbox" type="number" name="channel" value="channel" min="1" max="100" placeholder="1-100" contenteditable>0</span>.00 MHz</p>
        <!--input id="channel" type="number" name="channel" value="channel" min="1" max="100" placeholder="1-100"-->
        <button id="submit" type="submit" name="channel">Connect</button>
      </div>
    </div>
  <script src="js/script.js" type="text/javascript"></script>
</body>
</html>
