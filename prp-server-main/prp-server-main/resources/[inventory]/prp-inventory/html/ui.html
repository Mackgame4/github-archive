  
<!DOCTYPE html>
<html>

<head>
    <title>Mythic Framework Inventory</title>
    <link href="https://fonts.googleapis.com/css?family=Signika" rel="stylesheet">
    <link href="./css/jquery-ui.min.css" rel="stylesheet" type="text/css">
    <link href="./css/bootstrap.min.css" rel="stylesheet" type="text/css">
    <link href="./css/style.min.css" rel="stylesheet" type="text/css">
</head>

<body>

    <div class="ui">
        <div class="inventory" id="inventory">
            <div class="inventory-wrapper">
                <div class="left-data" id="player-left-data">
                    <div id="player-inv-label" class="inv-label">Inventory Label</div>
                    <div id="player-inv-weight" class="weight-container">
                        <div id="player-weight-slider" class="weight-slider"></div>
                        <div id="player-weight-current" class="weight-text">
                            0.00
                        </div>
                        <div id="player-weight-max" class="weight-text">
                            0.00
                        </div>
                    </div>
                </div>
                <div id="inventoryOne">

                </div>
            </div>
            <div id="controls">
                <div class="controls-div">
                    <input class="control" id="search" type="text" placeholder="Search" />
                    <input type="number" class="control" id="count" value="0" onClick="this.select();">
                    <div class="control" id="use">Use</div>
                    <div class="control" id="pay">Pay</div>
                    <!-- <div class="control" id="give">Give</div> -->
                    <div class="control" id="craft">Craft</div>
                    <div class="control hidden" id="seize">Seize Cash</div>
                    <div class="control hidden" id="steal">Steal Cash</div>
                    </br></br>
                    <div class="close-ui">Close</div>
                </div>
                <div class="tooltip-div">
                    <div class="tooltip-name"></div>
                    <div class="tooltip-desc"></div>
                    <hr />
                    <div class="tooltip-weight"></div>
                    <div class="tooltip-uniqueness"></div>
                    <div class="tooltip-meta"></div>
                </div>
            </div>
            <div class="inventory-wrapper">
                <div class="right-data" id="other-right-data">
                    <div id="other-inv-label" class="inv-label">Inventory Label</div>
                    <div id="alternate-inv-weight" class="weight-container">
                        <div id="alternate-weight-slider" class="weight-slider"></div>
                        <div id="alternate-weight-current" class="weight-text">
                            0.00
                        </div>
                        <div id="alternate-weight-max" class="weight-text">
                            0.00
                        </div>
                    </div>
                </div>
                <div id="inventoryTwo">
                    
                </div>
            </div>
        </div>
        <div class="inv-log"></div>
        <div class="slot slot-template"><div class="item"><div class="item-count"></div><div class="item-price"></div><div class="item-name"></div></div></div>
    </div>

    <div class="near-players-wrapper">
        <div class="near-players-list">
            <div class="popup-header"><div class="popup-header-text">Nearby Players</div><div class="exit-popup">X</div></div>
            <div class="popup-body">
            </div>
        </div>
    </div>

    <div id="use-alert"></div>
    <div id="action-bar"></div>

    <script src="locales/en.js"></script>
    <script src="./js/jquery.min.js" type="text/javascript"></script>
    <script src="./js/jquery-ui.min.js" type="text/javascript"></script>
    <script src="./js/popper.min.js" type="text/javascript"></script>
    <script src="./js/bootstrap.min.js" type="text/javascript"></script>
    <script src="./js/config.js" type="text/javascript"></script>
    <script src="./js/inventory.js" type="text/javascript"></script>
</body>
<script>
    $(document).ready(function () {
        $("#use").html(invLocale.useItem);
        $("#give").html(invLocale.giveItem);
        $("#pay").html(invLocale.dropItem);
        $("#inv-label").html(invLocale.label);
        $("#steal").html(invLocale.stealmoney);
        $("#seize").html(invLocale.seizemoney);
        $("#take").html(invLocale.takemoney);
        $("#store").html(invLocale.storemoney);

        document.querySelector('#count').addEventListener('change', function(e) {
            if (parseInt(e.target.value) < 0) {
                e.target.value = 0;
            }
        });
    });
</script>
</html>
