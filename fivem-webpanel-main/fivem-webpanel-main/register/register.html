<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>FTWRP | Register</title>
		<link rel="icon" type="image/png" href="https://shop.ftw.pt/image/catalog/ftwshop.png"/>
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.1/css/all.css">
        <link href="style_register.css" rel="stylesheet" type="text/css">
	</head>
	<body>
		<img src="https://shop.ftw.pt/image/catalog/ftwshop.png" width="120px" height="100px"></img>
		<div class="register">
			<h1>Register</h1>
			<form action="register.php" method="post" autocomplete="off">
				<label for="username">
					<i class="fas fa-user"></i>
				</label>
				<input type="text" name="username" placeholder="Username" id="username" required>
				<label for="email">
					<i class="fas fa-envelope"></i>
				</label>
				<input type="email" name="email" placeholder="Email" id="email" required>
				<label for="password">
					<i class="fas fa-lock"></i>
				</label>
				<input type="password" name="password" placeholder="Password" id="password" required>
				<span class="msg-error error"></span>
				<div id="recaptcha" class="g-recaptcha" data-sitekey="6Ld9Qw4aAAAAAIDG98yCLkyEYFb8gf_c1TPQKmHO" data-callback="enableBtn"></div>
				<input class="btn" id="btn-validate" type="submit" value="Register" disabled="disabled">
			</form>
		</div>
		<footer>
			<p><span>Made with </span><i class="fas fa-heart" style="color: red;"></i><span> by Mack&FTWRP</span></p>
		</footer>
	</body>
	<script src='https://www.google.com/recaptcha/api.js'></script>
	<style>
		msg-error {
		color: red;
		}
		.g-recaptcha.error {
		border: solid 2px rgb(170, 0, 0);
		padding: .1em;
		width: 19.3em;
		}
	</style>
	<script>
		function enableBtn(){
			document.getElementById("btn-validate").disabled = false;
		}
		$( '#btn-validate' ).click(function(){
		var $captcha = $( '#recaptcha' ),
			response = grecaptcha.getResponse();
		
		if (response.length === 0) {
			//$( '.msg-error').text( "reCAPTCHA is mandatory" );
			if( !$captcha.hasClass( "error" ) ){
			$captcha.addClass( "error" );
			}
		} else {
			//$( '.msg-error' ).text('');
			$captcha.removeClass( "error" );
			//alert( 'reCAPTCHA marked' );
		}
		})
	</script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
</html>
