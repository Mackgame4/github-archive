[workspace]
resolver = "2"
members = [
    "apps/server",
    "apps/web",
    "crates/core",
    "crates/contracts",
    "crates/application",
    "crates/infrastructure",
    "crates/api",
    "crates/ui",
    "tools/orbis-seeder",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
http = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
topcoat = { version = "0.10.0", default-features = false, features = ["router", "tower", "view"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors", "fs", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
utoipa = { version = "5.4.0", features = ["axum_extras"] }

[profile.release]
lto = true

